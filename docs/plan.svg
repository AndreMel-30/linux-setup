<svg xmlns="http://www.w3.org/2000/svg" width="883" height="634" viewBox="0 0 883 634" role="img">
<title>The plan install.sh shows before changing anything</title>
<rect width="883" height="634" rx="10" fill="#1a1b26"/>
<rect width="883" height="34" rx="10" fill="#24283b"/>
<rect y="24" width="883" height="10" fill="#24283b"/>
<circle cx="20" cy="17" r="6" fill="#f7768e"/>
<circle cx="40" cy="17" r="6" fill="#e0af68"/>
<circle cx="60" cy="17" r="6" fill="#9ece6a"/>
<text x="441.5" y="22" fill="#8a8fa8" font-family="sans-serif" font-size="13" text-anchor="middle">install.sh</text>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
<text x="20" y="68" fill="#9ece6a">$ ./install.sh myname</text>
<text x="20" y="108" fill="#7aa2f7" font-weight="bold">==&gt; Profile: /home/me/linux-setup/profiles/myname</text>
<text x="20" y="128" fill="#c8ccd4">   Distro: Linux Mint 22.3</text>
<text x="20" y="168" fill="#7aa2f7" font-weight="bold">==&gt; Plan</text>
<text x="20" y="208" fill="#e6e6e6" font-weight="bold">   Packages</text>
<text x="20" y="228" fill="#c8ccd4">     apt repositories   5 to add: brave-browser-release, claude-desktop, docker, tailscale, vscodium</text>
<text x="20" y="248" fill="#c8ccd4">     System upgrade     yes (apt full-upgrade)</text>
<text x="20" y="268" fill="#c8ccd4">     apt packages       96 to install</text>
<text x="20" y="288" fill="#c8ccd4">     Flatpak apps       2 to install: com.rustdesk.RustDesk, org.localsend.localsend_app</text>
<text x="20" y="308" fill="#c8ccd4">     Snap apps          skipped (DO_SNAP=false)</text>
<text x="20" y="348" fill="#e6e6e6" font-weight="bold">   System</text>
<text x="20" y="368" fill="#c8ccd4">     Swappiness         10</text>
<text x="20" y="388" fill="#c8ccd4">     TRIM               weekly timer on</text>
<text x="20" y="428" fill="#e6e6e6" font-weight="bold">   Desktop and home folder</text>
<text x="20" y="448" fill="#c8ccd4">     Desktop settings   4 dconf branches: /org/cinnamon/, /org/gnome/terminal/, /org/nemo/, /org/x/</text>
<text x="20" y="468" fill="#c8ccd4">     Dotfiles           3 to link, 0 already linked</text>
<text x="20" y="488" fill="#c8ccd4">                        2 existing file(s) in your home will be renamed to .bak.&lt;date&gt;</text>
<text x="20" y="528" fill="#e6e6e6" font-weight="bold">   Your own scripts</text>
<text x="20" y="548" fill="#c8ccd4">     Hooks              none</text>
<text x="20" y="588" fill="#c8ccd4">Nothing has been changed yet. If you continue, you will be asked for your password.</text>
<text x="20" y="608" fill="#e6e6e6" font-weight="bold">Continue? [y/N] </text>
<rect x="154.9" y="596" width="8.4" height="17" fill="#c8ccd4"/>
</g>
</svg>

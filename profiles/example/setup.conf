# Settings for this profile. This file is plain bash, read by backup.sh and install.sh.
# You edit it by hand; the scripts never change it. (backup.sh only copies it
# from profiles/example the first time you create a new profile.)
#
# For true/false switches, an empty value means "don't touch".

# Which parts to handle
DO_APT=true
DO_FLATPAK=true
DO_SNAP=true         # set to false on distros without snap (e.g. Linux Mint)
DO_DCONF=true        # desktop settings (Cinnamon, GNOME, MATE, Budgie...)
DO_DOTFILES=true
DO_HOOKS=true        # your own scripts in hooks/

# System tweaks (applied by install.sh)
SWAPPINESS=           # e.g. 10. Ubuntu and Mint default to 60. Empty = leave it alone
ENABLE_TRIM=true

# Files or folders in your home folder to save (paths relative to ~)
DOTFILES=(.bashrc .bash_aliases .profile .gitconfig .inputrc .vimrc .nanorc)

# dconf branches to save. Empty = picked automatically from your desktop.
# Example: DCONF_PATHS=(/org/cinnamon/ /org/nemo/)
DCONF_PATHS=()
